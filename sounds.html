<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoD sounds</title>
<style>
:root{--bg:#0e1013;--card:#171a1f;--line:#2c3138;--tx:#e6e9ec;--mut:#8f969f;--a:#6fd3ff;--b:#ffb86b}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:16px 16px 60px;max-width:900px;margin:auto}
h1{font-size:20px;margin:6px 0 2px} p{color:var(--mut);margin:4px 0 14px} h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:26px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;gap:14px;align-items:center;z-index:2;border-bottom:1px solid var(--line)}
.row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.nm{font-weight:600} .ds{color:var(--mut);font-size:13px} .bt{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{font:inherit;border:1px solid var(--a);background:transparent;color:var(--a);padding:7px 12px;border-radius:6px;cursor:pointer} button:hover{background:rgba(111,211,255,.12)}
button.alt{border-color:var(--b);color:var(--b)} button.alt:hover{background:rgba(255,184,107,.12)} button.ab{border-color:var(--line);color:var(--tx)}
@media(max-width:600px){.row{grid-template-columns:1fr}.bt{justify-content:flex-start}}
</style></head><body>
<h1>VoD sound effects</h1><p>Blue = the sound as it is in the game now (this page runs the game's own sound code). Orange = alternates to compare. "A then B" plays both one after the other.</p>
<div class="bar"><label>Volume <input id="vol" type="range" min="0" max="1" step=".05" value=".8"></label><label>Distance <select id="dist"><option value="1">own / near (1.0)</option><option value=".5">far (0.5)</option><option value=".25">very far (0.25)</option></select></label></div>
<div id="list"></div>
<script>
const $ = id => { const e = document.getElementById(id); return e || { style: {}, textContent: '', onclick: null }; };
let G = null, me = 0, snaps = [], latest = () => null, WC = () => ({}), PFC = () => ({}), AW = () => [];
// VoD registry: shared constants, small helpers, and the three plug-in lists (ships, playfields, weapons). See src/README.md.
// A module file calls VOD.ship(id, def), VOD.playfield(id, def) or VOD.weapon(id, def); build.py includes every file in those folders, nothing else to edit.
(function () {
  var VOD = globalThis.VOD = { K: {}, u: {}, ships: {}, playfields: {}, weapons: {} };
  VOD.K = { S: 30, STEP: 3, W: 2100, H: 1300, CELL: 100, NB: 5, POWER: 100, WEAPON_CD: 4, FIX: 1 / 60, COLORS: ['cyan', 'magenta', 'lightgreen', 'yellow', 'orange'] };
  // S: pixels per physics metre. STEP: seconds between thrust locks (the "tick"). W, H: default playfield size. FIX: physics step.
  VOD.u = {
    mulberry: function (a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }, // seeded random numbers
    rnd: function (a, b) { return a + Math.random() * (b - a); },
    pick: function (arr) { return arr.splice(Math.floor(Math.random() * arr.length), 1)[0]; }, // removes and returns a random element
    hull: function (p) { // convex hull (monotone chain)
      p = p.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
      var cr = function (o, a, b) { return (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]); }, lo = [], up = [], i;
      for (i = 0; i < p.length; i++) { while (lo.length > 1 && cr(lo[lo.length-2], lo[lo.length-1], p[i]) <= 0) lo.pop(); lo.push(p[i]); }
      for (i = p.length - 1; i >= 0; i--) { while (up.length > 1 && cr(up[up.length-2], up[up.length-1], p[i]) <= 0) up.pop(); up.push(p[i]); }
      lo.pop(); up.pop(); return lo.concat(up);
    }
  };
  var reg = function (kind) { return function (id, def) { def.id = id; def.order = def.order || 50; VOD[kind][id] = def; return def; }; };
  VOD.ship = reg('ships'); VOD.playfield = reg('playfields'); VOD.weapon = reg('weapons');
  VOD.list = function (kind) { return Object.keys(VOD[kind]).map(function (k) { return VOD[kind][k]; }).sort(function (a, b) { return a.order - b.order || (a.id < b.id ? -1 : 1); }); };
})();

// Weapon "Gun": instant hit on the designated ship if it is within range and in the clear; weak, with half the usual cooldown. VOD.weapon(id, def) - see src/README.md.
(function () {
var S = VOD.K.S, RANGE = 320, DMG = 25, CD = VOD.K.WEAPON_CD / 2;
var clearOf = function (t) { return function (u) { return u && u.projectile && u !== t; }; }; // projectiles do not block the shot, except the target itself

VOD.weapon('gun', {
  label: 'Gun', order: 10,
  targeted: true,   // the pilot arms it, then taps the target ship; host.fire(i, target) gets that ship
  range: RANGE,     // shown to the pilot as a circle while aiming
  hits: ['missile'], // besides ships, it can shoot down a missile in flight (the pilot taps the missile)
  host: {
    fire: function (h, sh, t) { // called only when the pilot is alive and off cooldown; return true when fired (and set sh.readyAt), or h.nofire(sh, 'reason')
      var V = h.V, p = sh.body.GetPosition(), q = t.body.GetPosition(), x = p.x * S, y = p.y * S, dx = q.x * S - x, dy = q.y * S - y, len = Math.hypot(dx, dy) || 1;
      if (len > RANGE) return h.nofire(sh, 'out of range');
      var r = h.sight(sh.body, t.body, clearOf(t));
      if (!r.clear) return h.nofire(sh, 'no line of sight');
      if (t.kind === 'missile') { t.exploding = true; h.events.push({ e: 'shot', i: sh.i, x1: Math.round(x), y1: Math.round(y), x2: Math.round(q.x * S), y2: Math.round(q.y * S), hit: true }); sh.readyAt = h.time + CD; return true; } // shot down: it explodes where it is
      h.damage(t, DMG); t.body.ApplyImpulse(new V(dx / len * .15, dy / len * .15), t.body.GetWorldCenter()); // a small shove
      h.events.push({ e: 'shot', i: sh.i, x1: Math.round(x), y1: Math.round(y), x2: Math.round(r.pt.x * S), y2: Math.round(r.pt.y * S), hit: true });
      sh.readyAt = h.time + CD; return true;
    }
  },
  client: {
    sound: function (e, v, T) { if (e.e !== 'shot') return; const c = SND.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain(); // the minimal laser: a short sine zap sliding from 1200 to 300 Hz in 80 ms
      o.type = 'sine'; o.frequency.setValueAtTime(1200, t); o.frequency.exponentialRampToValueAtTime(300, t + .08); g.gain.setValueAtTime(.25 * v, t); g.gain.exponentialRampToValueAtTime(.001, t + .08); o.connect(g); g.connect(SND.master); o.start(t); o.stop(t + .09); },
    fx: function (f, now) { // draws one host event (f.e, f.at = arrival time) per frame; events live 0.7 s
      if (f.e !== 'shot') return;
      const a = 1 - (now - f.at) / 260; if (a <= 0) return; // gun tracer
      ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, 2 / sc); ctx.beginPath(); ctx.moveTo(f.x1, f.y1); ctx.lineTo(f.x2, f.y2); ctx.stroke();
      if (f.hit) { ctx.fillStyle = '#fff'; circle(f.x2, f.y2, 8 + 10 * (1 - a)); ctx.fill(); } ctx.restore();
    }
  }
});
})();

// Weapon "Hammer": a heavy ball whirling round the ship on a tether. Not out at the start: the Fire button deploys it, and retracts it again (no cooldown).
// It takes no damage; a ship it strikes loses hull (dmg % at full swing speed). It hits everything except buoys: a ship is knocked by the swing (its velocity changes, physics-style) and loses its planned thrusts and hull;
// a rock is knocked the same way, and either way the owner gets the equal and opposite push through the tether; walls, rings, the planet and moons throw the hammer's owner back; a missile or mine it touches goes off.
// The ball is a sensor driven round the ship each physics step; the knock is worked out in hit(). It is retracted when its owner is destroyed.
(function () {
var K = VOD.K, S = K.S, HAMMER = { R: 85, w: 2.5, rad: 17, kick: .6, again: .4, dmg: 30 }; // R: tether length px, w: rad/s, kick: share of the swing's relative velocity handed to the ship, again: s before the same ship can be hit again
var find = function (h, i) { return (h.ws.hammers || []).filter(function (m) { return m.owner === i; })[0]; };
var drop = function (h, m) { h.world.DestroyBody(m.body); h.ws.hammers.splice(h.ws.hammers.indexOf(m), 1); };

VOD.weapon('hammer', {
  label: 'Hammer', order: 40,
  targeted: false,
  host: {
    fire: function (h, sh) { // toggles
      h.ws.hammers = h.ws.hammers || []; var m = find(h, sh.i);
      if (m) { drop(h, m); h.events.push({ e: 'retract', i: sh.i }); return true; }
      var p = sh.body.GetPosition(); m = { kind: 'hammer', projectile: true, owner: sh.i, a: sh.body.GetAngle(),
        hit: function (hh, o) {
          var k = o && o.kind, ow = hh.ships[this.owner];
          if (!o || k === 'buoy' || k === 'hammer' || o === ow) return;
          if (k === 'missile' || k === 'mine') { o.exploding = true; return; } // a swatted weapon goes off
          var key = 'ham' + this.owner; if (hh.time < (o[key] || 0)) return; o[key] = hh.time + HAMMER.again;
          var vb = this.body.GetLinearVelocity(), bp = this.body.GetPosition(), x = Math.round(bp.x * S), y = Math.round(bp.y * S), V = hh.V;
          if (k === 'ship') { // not a wreck or a fresh respawn
            if (o.dead || hh.time < o.inv) return;
            var vs = o.body.GetLinearVelocity(), mm = o.body.GetMass() * HAMMER.kick, rx = (vb.x - vs.x) * mm, ry = (vb.y - vs.y) * mm; // (GetLinearVelocity returns the live vector, so the swing is worked out before anything is applied)
            o.body.ApplyImpulse(new V(rx, ry), o.body.GetWorldCenter()); o.q = [[0, 0], [0, 0]]; o.zc++;
            ow.body.ApplyImpulse(new V(-rx, -ry), ow.body.GetWorldCenter()); // equal and opposite: the tether pulls the owner back
            hh.damage(o, HAMMER.dmg * Math.min(1.5, Math.hypot(rx, ry) / mm / (HAMMER.w * HAMMER.R / S))); // the harder the swing meets it, the more it hurts
            hh.events.push({ e: 'bonk', i: o.i, x: x, y: y });
          } else if (o.body.GetType() === hh.b2.Dynamics.b2Body.b2_dynamicBody) { // a rock: a heavy one hardly moves, and the owner's recoil is capped at what a ship hit would give
            var vr = o.body.GetLinearVelocity(), mr = Math.min(o.body.GetMass() * HAMMER.kick, ow.body.GetMass() * HAMMER.kick), rx = (vb.x - vr.x) * mr, ry = (vb.y - vr.y) * mr;
            o.body.ApplyImpulse(new V(rx, ry), o.body.GetWorldCenter()); hh.events.push({ e: 'bonk', x: x, y: y });
            ow.body.ApplyImpulse(new V(-rx, -ry), ow.body.GetWorldCenter()); // equal and opposite
          } else if (!ow.dead) { // something fixed: the swing comes to a halt and jerks the owner back
            var vo = ow.body.GetLinearVelocity(), mo = ow.body.GetMass() * HAMMER.kick * .5;
            ow.body.ApplyImpulse(new V((vo.x - vb.x) * mo, (vo.y - vb.y) * mo), ow.body.GetWorldCenter()); hh.events.push({ e: 'bonk', x: x, y: y });
          }
        } };
      m.body = h.body(m, p.x * S, p.y * S, null, HAMMER.rad); // a sensor
      h.ws.hammers.push(m); h.events.push({ e: 'deploy', i: sh.i }); return true;
    },
    before: function (h) { // every step: carry each ball round its ship
      (h.ws.hammers || []).slice().forEach(function (m) {
        var sh = h.ships[m.owner]; if (sh.dead) { drop(h, m); return; }
        m.a += HAMMER.w * K.FIX; var p = sh.body.GetPosition(), v = sh.body.GetLinearVelocity(), c = Math.cos(m.a), s = Math.sin(m.a), R = HAMMER.R / S;
        m.body.SetPosition(new h.V(p.x + c * R, p.y + s * R));
        m.body.SetLinearVelocity(new h.V(v.x - s * R * HAMMER.w, v.y + c * R * HAMMER.w)); // the ship's velocity plus the swing
      });
    },
    init: function () { return { R: HAMMER.R }; },
    snapshot: function (h) { var r1 = function (v) { return Math.round(v * 10) / 10; }; return { hammers: (h.ws.hammers || []).map(function (m) { var p = m.body.GetPosition(); return [r1(p.x * S), r1(p.y * S), m.owner]; }) }; }
  },
  client: {
    sound: function (e, v, T) {
      if (e.e === 'deploy') { T.tone(120, 520, .4, 'sawtooth', .25 * v, 0, .08); T.noise(.4, 'bandpass', 500, 1500, .6 * v, 0, .1); }
      else if (e.e === 'retract') { T.tone(520, 120, .3, 'sawtooth', .25 * v, 0, .05); T.noise(.3, 'bandpass', 1500, 500, .5 * v, 0, .06); }
      else if (e.e === 'bonk') CORE_SOUNDS.hit({ d: 20 }, v); // the same sound as any other hit
    },
    verb: function (s, me) { return (s.w.hammers || []).some(function (m) { return m[2] === me; }) ? 'Retract' : 'Deploy'; }, // button: "Deploy Hammer" / "Retract Hammer"
    interp: function (a, b, L) { return { hammers: (a.hammers || []).map(function (m) { const n = (b.hammers || []).find(o => o[2] === m[2]); return n ? [L(m[0], n[0]), L(m[1], n[1]), m[2]] : m; }) }; },
    draw: function (G, I, now) {
      I.w.hammers.forEach(m => {
        const sh = I.ships[m[2]], col = G.players[m[2]].color; if (!sh || sh.hid) return;
        ctx.save(); ctx.strokeStyle = col; ctx.globalAlpha = .7; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(m[0], m[1]); ctx.stroke(); ctx.globalAlpha = 1; // the tether
        ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.fillStyle = '#000'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; circle(m[0], m[1], 17); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0; ctx.fillStyle = col; circle(m[0], m[1], 6); ctx.fill(); ctx.restore();
      });
    },
    fx: function (f, now) { // a knock: a ring where the ship was struck
      if (f.e !== 'bonk') return;
      const t = (now - f.at) / 500; if (t >= 1) return;
      ctx.save(); ctx.globalAlpha = 1 - t; ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(3, 3 / sc); circle(f.x, f.y, 25 + 55 * t); ctx.stroke(); ctx.restore();
    }
  }
});
})();

// Weapon "Harpoon": used like the gun (arm, tap the target), but shorter range, harder hitting, and it reels the two ships in: both are yanked towards each other.
(function () {
var K = VOD.K, S = K.S, RANGE = 260, DMG = 40, YANK = 100, CD = K.WEAPON_CD; // YANK: velocity change in px/s given to each ship, towards the other
var noProjectiles = function (u) { return u && u.projectile; };

VOD.weapon('harpoon', {
  label: 'Harpoon', order: 50,
  targeted: true, range: RANGE,
  host: {
    fire: function (h, sh, t) {
      var V = h.V, p = sh.body.GetPosition(), q = t.body.GetPosition(), x = p.x * S, y = p.y * S, dx = q.x * S - x, dy = q.y * S - y, len = Math.hypot(dx, dy) || 1;
      if (len > RANGE) return h.nofire(sh, 'out of range');
      var r = h.sight(sh.body, t.body, noProjectiles);
      if (!r.clear) return h.nofire(sh, 'no line of sight');
      var ux = dx / len, uy = dy / len, kt = t.body.GetMass() * YANK / S, ks = sh.body.GetMass() * YANK / S;
      t.body.ApplyImpulse(new V(-ux * kt, -uy * kt), t.body.GetWorldCenter()); sh.body.ApplyImpulse(new V(ux * ks, uy * ks), sh.body.GetWorldCenter()); // towards each other
      h.damage(t, DMG);
      h.events.push({ e: 'harpoon', i: sh.i, t: t.i });
      sh.readyAt = h.time + CD; return true;
    }
  },
  client: {
    sound: function (e, v, T) { if (e.e === 'harpoon') { T.tone(700, 200, .4, 'sawtooth', .4 * v); T.tone(1400, 400, .3, 'triangle', .15 * v) } }, // a twang
    fx: function (f, now) { // a rope between the two ships that goes slack as they close in
      if (f.e !== 'harpoon') return;
      const a = 1 - (now - f.at) / 600; if (a <= 0 || !snaps.length) return;
      const I = interp(now - 100), s1 = I.ships[f.i], s2 = I.ships[f.t]; if (!s1 || !s2 || s1.hid || s2.hid) return;
      ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, 2 / sc); ctx.setLineDash([10 / sc, 6 / sc]); ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#fff'; circle(s2.x, s2.y, 7 + 8 * (1 - a)); ctx.fill(); ctx.restore();
    }
  }
});
})();

// Weapon "Mine": the Fire button drops a mine behind the ship, where it stays (gravity still pulls it). After a short arming time it explodes when any ship, the
// owner's too, comes within its trigger distance; the pilot can also detonate it at any time (the button becomes Detonate). One per pilot in play; the cooldown
// starts when it is gone. The explosion is a heavy collision for every ship in reach (h.blast).
(function () {
var K = VOD.K, S = K.S, MINE = { arm: 1.5, trigger: 55, life: 90, radius: 9, drop: 75 }, BLAST = { r: 120, dmg: 60, push: 2 };
var mine = function (h, i) { return h.projectiles.filter(function (m) { return m.kind === 'mine' && m.owner === i; }); };

VOD.weapon('mine', {
  label: 'Mine', order: 30,
  targeted: false, // no target: Fire just drops it
  host: {
    fire: function (h, sh) {
      if (mine(h, sh.i).length) return h.nofire(sh, 'a mine is already in play');
      var p = sh.body.GetPosition(), v = sh.body.GetLinearVelocity(), sp = Math.hypot(v.x, v.y) * S, ang = sp > 5 ? Math.atan2(v.y, v.x) : sh.body.GetAngle();
      var m = { kind: 'mine', projectile: true, owner: sh.i, born: h.time, exploding: false }; // a sensor: ships fly through it, it only watches them
      m.body = h.body(m, p.x * S - Math.cos(ang) * MINE.drop, p.y * S - Math.sin(ang) * MINE.drop, null, MINE.radius); m.body.SetLinearVelocity(new h.V(0, 0));
      h.projectiles.push(m); h.events.push({ e: 'drop', i: sh.i }); return true;
    },
    detonate: function (h, i) { var ms = mine(h, i); ms.forEach(function (m) { m.exploding = true; }); return ms.length > 0; },
    before: function (h) { // every step: look for ships in reach of an armed mine, and for old mines
      h.projectiles.forEach(function (m) {
        if (m.kind !== 'mine') return;
        if (h.time - m.born > MINE.life) m.exploding = true;
        if (m.exploding || h.time - m.born < MINE.arm) return;
        var p = m.body.GetPosition();
        h.ships.forEach(function (s) { if (!s.dead && Math.hypot(s.body.GetPosition().x - p.x, s.body.GetPosition().y - p.y) * S < MINE.trigger) m.exploding = true; });
      });
    },
    after: function (h) {
      for (var i = h.projectiles.length - 1; i >= 0; i--) {
        var m = h.projectiles[i]; if (m.kind !== 'mine' || !m.exploding) continue;
        var p = m.body.GetPosition(); h.blast(p.x * S, p.y * S, BLAST); h.world.DestroyBody(m.body); h.projectiles.splice(i, 1);
        var ow = h.ships[m.owner]; if (ow) ow.readyAt = h.time + K.WEAPON_CD;
      }
    },
    init: function () { return { arm: MINE.arm, trigger: MINE.trigger }; },
    snapshot: function (h) { // [x, y, owner, armed 0/1]
      var r1 = function (v) { return Math.round(v * 10) / 10; };
      return { mines: h.projectiles.filter(function (m) { return m.kind === 'mine'; }).map(function (m) { var p = m.body.GetPosition(); return [r1(p.x * S), r1(p.y * S), m.owner, h.time - m.born >= MINE.arm ? 1 : 0]; }) };
    }
  },
  client: {
    sound: function (e, v, T) { if (e.e === 'drop') { T.tone(500, 380, .12, 'triangle', .3 * v); T.tone(1000, 1000, .12, 'sine', .3 * v, .12); } },
    verb: 'Drop', // the button reads "Drop Mine"
    canDetonate: function (s, me) { return (s.w.mines || []).some(function (m) { return m[2] === me; }); },
    interp: function (a, b, L) { return { mines: (a.mines || []).map(function (m) { const n = (b.mines || []).find(o => o[2] === m[2]); return n ? [L(m[0], n[0]), L(m[1], n[1]), m[2], n[3]] : m; }) }; },
    draw: function (G, I, now) {
      I.w.mines.forEach(m => {
        const col = G.players[m[2]].color, pulse = m[3] ? .5 + .5 * Math.sin(now / 120) : .25 + .25 * Math.sin(now / 400);
        ctx.save(); ctx.translate(m[0], m[1]); ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.fillStyle = '#000'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 8, Math.sin(a) * 8); ctx.lineTo(Math.cos(a) * 15, Math.sin(a) * 15); ctx.stroke(); }
        circle(0, 0, 9); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0; ctx.fillStyle = col; ctx.globalAlpha = pulse; circle(0, 0, 4); ctx.fill(); ctx.restore();
        if (m[3] && G.w && G.w.trigger) { ctx.save(); ctx.globalAlpha = .18; ctx.strokeStyle = col; ctx.setLineDash([6 / sc, 8 / sc]); ctx.lineWidth = Math.max(1.5, 1.5 / sc); circle(m[0], m[1], G.w.trigger); ctx.stroke(); ctx.restore(); } // its trigger distance
      });
    },
    fx: function (f, now) { // the explosion: a flash and a ring that grows to the blast radius
      if (f.e !== 'blast') return;
      const t = (now - f.at) / 700; if (t >= 1) return;
      ctx.save(); ctx.globalAlpha = 1 - t; ctx.fillStyle = '#fff'; if (t < .2) { circle(f.x, f.y, f.r * .5 * (1 - t / .2) + 12); ctx.fill(); }

  const d = document.createElement('div'); d.className = 'row'; d.innerHTML = '<div><div class="nm"></div><div class="ds"></div></div><div class="bt"></div>';
  d.querySelector('.nm').textContent = r[1]; d.querySelector('.ds').textContent = r[2];
  const bt = d.querySelector('.bt'), add = (t, cls, f) => { const b = document.createElement('button'); b.textContent = t; b.className = cls; b.onclick = f; bt.appendChild(b); };
  add('Current', '', () => play(r[4], r[3]));
  r[5].forEach(a => { add(a[0], 'alt', () => play(a[1], r[3])); add('Current, then ' + a[0], 'ab', () => { play(r[4], r[3]); setTimeout(() => play(a[1], r[3]), 1300); }); });
  list.appendChild(d);
});
</script></body></html>
